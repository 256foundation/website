name: CI

# Run lint, tests, a production build, and a Lighthouse budget check on every
# pull request. The deploy workflow only covers pushes to main, so without this
# a regression ships unverified.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, Lighthouse
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://256foundation.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Lighthouse budget
        run: npm run lhci
